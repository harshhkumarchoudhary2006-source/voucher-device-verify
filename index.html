<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voucher Referral Bot • Secure Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body{margin:0;background:#0b1118;color:#fff;font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
    .box{width:min(430px,88%);background:#111b25;border:1px solid #263747;border-radius:20px;padding:28px;text-align:center;box-sizing:border-box}
    .ok{font-size:48px;margin-bottom:12px}.title{font-size:24px;font-weight:700}.sub{color:#aeb9c5;margin-top:10px;line-height:1.5}
    button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:12px;background:#2481cc;color:#fff;font-size:17px;font-weight:700}
    .err{color:#ff6b6b}
  </style>
</head>
<body>
<div class="box">
  <div id="icon" class="ok">🔐</div>
  <div id="title" class="title">Device Verification</div>
  <div id="msg" class="sub">Verifying your Telegram session...</div>
  <button id="retry" style="display:none" onclick="verify()">Verify Again</button>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

function deviceKey() {
  const key = "voucher_referral_device_key";
  let v = localStorage.getItem(key);
  if (!v) {
    v = crypto.randomUUID ? crypto.randomUUID() :
      ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    localStorage.setItem(key, v);
  }
  return v;
}

function showError(msg) {
  document.getElementById("icon").textContent = "❌";
  document.getElementById("title").textContent = "Verification Failed";
  document.getElementById("msg").innerHTML = '<span class="err">'+msg+'</span>';
  document.getElementById("retry").style.display = "block";
}

function verify() {
  if (!tg || !tg.initData) {
    showError("Telegram authentication data was not received. Please close this page and open Verify My Device again from the bot.");
    return;
  }

  const payload = {
    action: "verify_device",
    init_data: tg.initData,
    device_id: deviceKey()
  };

  try {
    tg.sendData(JSON.stringify(payload));
    document.getElementById("icon").textContent = "✅";
    document.getElementById("title").textContent = "Device Verified";
    document.getElementById("msg").textContent = "Verification completed. Return to Voucher Referral Bot.";
    setTimeout(() => tg.close(), 900);
  } catch (e) {
    showError("Telegram could not send the verification result. Please open this page again from the bot.");
  }
}

verify();
</script>
</body>
</html>
