<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087cff">
  <title>Voucher Referral Bot - Device Verification</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #07152f, #0b3d91, #006eff); padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; background: rgba(255,255,255,.97);
      border-radius: 24px; padding: 35px 25px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .icon {
      width: 85px; height: 85px; margin: 0 auto 20px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      background: #e8f1ff; font-size: 42px;
    }
    h1 { color: #09285f; font-size: 25px; margin-bottom: 15px; }
    p { color: #555; line-height: 1.6; font-size: 15px; margin-bottom: 25px; }
    .button {
      width: 100%; border: none; border-radius: 14px; padding: 15px;
      font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none;
      display: block; transition: .2s;
    }
    .verify { background: #087cff; color: white; }
    .verify:hover { background: #0068dc; }
    .status { display: none; color: #159447; font-weight: bold; margin-bottom: 20px; font-size: 16px; }
    .error { display: none; color: #dc2626; font-weight: bold; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
    .small { margin-top: 20px; font-size: 12px; color: #888; }
    .loading { display: none; color: #555; font-size: 14px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">🔐</div>

    <h1 id="title">Device Verification Required</h1>

    <p id="message">
      Before using Voucher Referral Bot, you need to complete a quick
      device verification.
    </p>

    <button class="button verify" id="verifyButton" onclick="verifyDevice()">
      🔐 Verify Device
    </button>

    <div class="loading" id="loading">Checking your Telegram device...</div>

    <div class="status" id="status">✅ Device Verified</div>
    <div class="error" id="error"></div>

    <div class="small">
      Voucher Referral Bot • Secure Verification
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function showError(text) {
      document.getElementById("icon").innerHTML = "❌";
      document.getElementById("title").innerHTML = "Verification Failed";
      document.getElementById("error").innerText = text;
      document.getElementById("error").style.display = "block";
      document.getElementById("loading").style.display = "none";
      document.getElementById("verifyButton").style.display = "block";
    }

    function verifyDevice() {
      if (!tg) {
        showError("Please open this verification page from inside Voucher Referral Bot on Telegram.");
        return;
      }

      if (!tg.initData) {
        showError("Telegram authentication data was not received. Please close this page and open Verify My Device again from the bot.");
        return;
      }

      document.getElementById("verifyButton").style.display = "none";
      document.getElementById("error").style.display = "none";
      document.getElementById("loading").style.display = "block";

      const biometric = tg.BiometricManager;

      if (!biometric) {
        showError("Your Telegram client does not provide device verification. Please update Telegram and try again.");
        return;
      }

      biometric.init(function() {
        const deviceId = String(biometric.deviceId || "").trim();

        if (!deviceId) {
          showError("Telegram did not provide a device identifier on this device. No referral point can be awarded from this verification.");
          return;
        }

        const payload = {
          action: "verify_device",
          device_id: deviceId,
          init_data: tg.initData
        };

        try {
          tg.sendData(JSON.stringify(payload));
        } catch (e) {
          showError("Telegram could not send the verification result. Please open Verify My Device again from the bot.");
        }
      });
    }
  </script>
</body>
</html>
